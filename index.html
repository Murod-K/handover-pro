<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Handover Pro — Система передачи смены</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090c12;
  --bg2:#0f1520;
  --card:#131928;
  --card2:#1a2235;
  --border:#1e2d47;
  --border2:#253550;
  --blue:#3b7eff;
  --blue2:#2563eb;
  --blue-glow:rgba(59,126,255,0.15);
  --cyan:#06b6d4;
  --green:#10b981;
  --yellow:#f59e0b;
  --red:#ef4444;
  --red-glow:rgba(239,68,68,0.12);
  --text:#e8edf5;
  --text2:#8a9bb5;
  --text3:#4d6080;
  --font-display:'Syne',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --r:12px;
  --r2:8px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow2:0 2px 12px rgba(0,0,0,0.3);
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 0%, rgba(59,126,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 80% 100%, rgba(6,182,212,0.04) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
}
#root{position:relative;z-index:1}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* LAYOUT */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:240px;flex-shrink:0;
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;
  z-index:100;
  transition:transform .3s ease;
}
.sidebar-logo{
  padding:24px 20px 20px;
  border-bottom:1px solid var(--border);
}
.logo-mark{
  display:flex;align-items:center;gap:10px;
}
.logo-icon{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
  box-shadow:0 0 20px rgba(59,126,255,0.3);
}
.logo-text{
  font-family:var(--font-display);
  font-weight:800;font-size:18px;
  letter-spacing:-0.5px;
}
.logo-text span{color:var(--blue)}
.logo-sub{font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:.5px;text-transform:uppercase}

.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-section-label{
  font-size:10px;color:var(--text3);
  letter-spacing:1px;text-transform:uppercase;
  padding:16px 10px 6px;
  font-family:var(--font-mono);
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--r2);
  cursor:pointer;
  color:var(--text2);
  font-size:14px;font-weight:500;
  transition:all .15s;
  position:relative;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{
  background:var(--blue-glow);
  color:var(--blue);
  border:1px solid rgba(59,126,255,0.2);
}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:20%;bottom:20%;
  width:3px;background:var(--blue);border-radius:0 2px 2px 0;
}
.nav-icon{font-size:16px;width:20px;text-align:center}
.nav-badge{
  margin-left:auto;
  background:var(--red);
  color:#fff;font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:10px;
  font-family:var(--font-mono);
}

.sidebar-footer{
  padding:16px;border-top:1px solid var(--border);
}
.sidebar-user{
  display:flex;align-items:center;gap:10px;
}
.user-avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#3b7eff44,#06b6d444);
  border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
.user-info{font-size:12px}
.user-name{font-weight:600;color:var(--text)}
.user-role{color:var(--text3)}

.main{margin-left:240px;flex:1;min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(9,12,18,0.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:0 28px;
  height:60px;display:flex;align-items:center;justify-content:space-between;
}
.topbar-title{
  font-family:var(--font-display);
  font-weight:700;font-size:18px;
}
.topbar-right{display:flex;align-items:center;gap:12px}
.page{padding:28px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 18px;border-radius:var(--r2);
  font-family:var(--font-body);font-size:14px;font-weight:600;
  cursor:pointer;border:none;transition:all .15s;
  white-space:nowrap;
}
.btn-primary{
  background:var(--blue);color:#fff;
  box-shadow:0 0 16px rgba(59,126,255,0.3);
}
.btn-primary:hover{background:var(--blue2);box-shadow:0 0 24px rgba(59,126,255,0.5)}
.btn-secondary{
  background:var(--card2);color:var(--text);
  border:1px solid var(--border2);
}
.btn-secondary:hover{background:var(--card);border-color:var(--blue)}
.btn-danger{background:rgba(239,68,68,0.15);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.btn-danger:hover{background:rgba(239,68,68,0.25)}
.btn-ghost{background:transparent;color:var(--text2);padding:8px}
.btn-ghost:hover{color:var(--text);background:var(--card)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* CARDS */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:20px;
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.card-title{
  font-family:var(--font-display);
  font-weight:700;font-size:16px;
}

/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:20px;
  position:relative;overflow:hidden;
  transition:border-color .2s;
}
.stat-card:hover{border-color:var(--border2)}
.stat-card::after{
  content:'';position:absolute;
  top:0;right:0;width:60px;height:60px;
  border-radius:0 var(--r) 0 60px;
  opacity:.08;
}
.stat-card.blue::after{background:var(--blue)}
.stat-card.green::after{background:var(--green)}
.stat-card.yellow::after{background:var(--yellow)}
.stat-card.red::after{background:var(--red)}
.stat-icon{font-size:22px;margin-bottom:10px}
.stat-val{
  font-family:var(--font-display);
  font-size:32px;font-weight:800;
  line-height:1;margin-bottom:4px;
}
.stat-label{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.stat-change{
  font-size:12px;margin-top:8px;
  color:var(--green);font-family:var(--font-mono);
}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
thead th{
  background:var(--bg2);
  padding:12px 16px;
  text-align:left;
  font-size:11px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--text3);font-family:var(--font-mono);
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody tr{
  border-bottom:1px solid var(--border);
  transition:background .1s;
}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--card2)}
tbody td{padding:12px 16px;font-size:14px;vertical-align:middle}

/* BADGES */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:20px;
  font-size:12px;font-weight:600;font-family:var(--font-mono);
  white-space:nowrap;
}
.badge-blue{background:rgba(59,126,255,0.15);color:var(--blue)}
.badge-green{background:rgba(16,185,129,0.15);color:var(--green)}
.badge-yellow{background:rgba(245,158,11,0.15);color:var(--yellow)}
.badge-red{background:rgba(239,68,68,0.15);color:var(--red)}
.badge-gray{background:rgba(138,155,181,0.1);color:var(--text2)}

/* FORMS */
.form-group{margin-bottom:16px}
.form-label{
  display:block;font-size:12px;font-weight:600;
  color:var(--text2);margin-bottom:6px;
  letter-spacing:.3px;text-transform:uppercase;
}
.form-input{
  width:100%;padding:10px 14px;
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:var(--r2);
  color:var(--text);font-family:var(--font-body);font-size:14px;
  outline:none;transition:border-color .15s;
}
.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-glow)}
.form-input::placeholder{color:var(--text3)}
.form-select{
  width:100%;padding:10px 14px;
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:var(--r2);
  color:var(--text);font-family:var(--font-body);font-size:14px;
  outline:none;appearance:none;cursor:pointer;
}
.form-select:focus{border-color:var(--blue)}
.form-textarea{resize:vertical;min-height:80px}

/* TOGGLE BUTTONS */
.toggle-group{display:flex;gap:6px;flex-wrap:wrap}
.toggle-btn{
  padding:8px 14px;border-radius:var(--r2);
  border:1px solid var(--border2);
  background:var(--bg2);color:var(--text2);
  cursor:pointer;font-size:13px;font-weight:500;
  transition:all .15s;white-space:nowrap;
}
.toggle-btn:hover{border-color:var(--blue);color:var(--text)}
.toggle-btn.active{
  background:var(--blue-glow);
  border-color:var(--blue);color:var(--blue);
  font-weight:600;
}
.toggle-btn.active-green{background:rgba(16,185,129,0.12);border-color:var(--green);color:var(--green)}
.toggle-btn.active-yellow{background:rgba(245,158,11,0.12);border-color:var(--yellow);color:var(--yellow)}
.toggle-btn.active-red{background:rgba(239,68,68,0.12);border-color:var(--red);color:var(--red)}

/* WIZARD */
.wizard-steps{display:flex;gap:0;margin-bottom:28px;position:relative}
.wizard-steps::before{
  content:'';position:absolute;
  top:16px;left:16px;right:16px;height:2px;
  background:var(--border);z-index:0;
}
.wizard-step{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:8px;position:relative;z-index:1;cursor:pointer;
}
.step-circle{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;font-family:var(--font-mono);
  border:2px solid var(--border);
  background:var(--bg2);
  transition:all .2s;
}
.wizard-step.done .step-circle{background:var(--green);border-color:var(--green);color:#fff}
.wizard-step.active .step-circle{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 12px rgba(59,126,255,0.4)}
.step-label{font-size:11px;color:var(--text3);text-align:center;letter-spacing:.3px}
.wizard-step.active .step-label{color:var(--blue)}
.wizard-step.done .step-label{color:var(--green)}

/* ALERTS */
.alert{
  padding:12px 16px;border-radius:var(--r2);
  display:flex;align-items:flex-start;gap:10px;
  margin-bottom:12px;font-size:14px;
}
.alert-yellow{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.25);color:var(--yellow)}
.alert-red{background:var(--red-glow);border:1px solid rgba(239,68,68,0.25);color:var(--red)}
.alert-green{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:var(--green)}
.alert-blue{background:var(--blue-glow);border:1px solid rgba(59,126,255,0.25);color:var(--blue)}

/* TOAST */
.toast-container{
  position:fixed;bottom:24px;right:24px;
  display:flex;flex-direction:column;gap:10px;
  z-index:9999;
}
.toast{
  background:var(--card2);
  border:1px solid var(--border2);
  border-radius:var(--r2);
  padding:12px 18px;
  font-size:14px;font-weight:500;
  box-shadow:var(--shadow);
  animation:toastIn .25s ease;
  display:flex;align-items:center;gap:10px;
  min-width:280px;
}
.toast.success{border-color:rgba(16,185,129,0.3);border-left:3px solid var(--green)}
.toast.error{border-color:rgba(239,68,68,0.3);border-left:3px solid var(--red)}
.toast.warning{border-color:rgba(245,158,11,0.3);border-left:3px solid var(--yellow)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);
  z-index:500;display:flex;align-items:center;justify-content:center;
  padding:20px;animation:fadeOverlay .15s ease;
}
@keyframes fadeOverlay{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);
  border:1px solid var(--border2);
  border-radius:var(--r);
  width:100%;max-width:560px;
  max-height:90vh;overflow-y:auto;
  box-shadow:0 24px 80px rgba(0,0,0,0.6);
  animation:modalIn .2s ease;
}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-header{
  padding:20px 24px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-title{font-family:var(--font-display);font-weight:700;font-size:18px}
.modal-body{padding:24px}
.modal-footer{
  padding:16px 24px;
  border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:10px;
}

/* CONSTRUCTION CARD */
.construction-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:16px;
  margin-bottom:12px;
  transition:border-color .15s;
}
.construction-card:hover{border-color:var(--border2)}
.construction-card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}

/* PRINT REPORT */
.report-preview{
  background:#fff;color:#1a1a2e;
  border-radius:var(--r);
  overflow:hidden;
  font-family:'DM Sans',sans-serif;
}

/* SECTION DIVIDER */
.section-divider{
  display:flex;align-items:center;gap:12px;
  margin:24px 0 16px;
}
.section-divider-line{flex:1;height:1px;background:var(--border)}
.section-divider-text{
  font-size:11px;color:var(--text3);
  text-transform:uppercase;letter-spacing:1px;
  font-family:var(--font-mono);white-space:nowrap;
}

/* CHECKBOX */
.checkbox-group{display:flex;flex-direction:column;gap:8px}
.checkbox-item{
  display:flex;align-items:center;gap:10px;
  cursor:pointer;padding:8px 12px;
  border-radius:var(--r2);border:1px solid var(--border);
  transition:all .15s;
}
.checkbox-item:hover{border-color:var(--border2);background:var(--card2)}
.checkbox-item.checked{
  border-color:rgba(239,68,68,0.3);
  background:rgba(239,68,68,0.05);
}
.checkbox-item input{display:none}
.check-visual{
  width:18px;height:18px;border-radius:4px;
  border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s;
}
.checkbox-item.checked .check-visual{
  background:var(--red);border-color:var(--red);
}

/* PROGRESS */
.progress-bar{
  height:4px;background:var(--border);
  border-radius:2px;overflow:hidden;
}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));
  border-radius:2px;transition:width .4s ease;
}

/* FILTERS */
.filter-bar{
  display:flex;gap:10px;flex-wrap:wrap;
  margin-bottom:16px;
}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:60px 20px;
  color:var(--text3);
}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.5}
.empty-title{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--text2);margin-bottom:8px}

/* DIVIDER */
hr{border:none;border-top:1px solid var(--border);margin:16px 0}

/* MOBILE */
.mobile-header{
  display:none;
  position:fixed;top:0;left:0;right:0;
  height:56px;background:var(--bg2);
  border-bottom:1px solid var(--border);
  z-index:200;align-items:center;padding:0 16px;justify-content:space-between;
}
.hamburger{
  background:none;border:none;cursor:pointer;
  color:var(--text);font-size:20px;padding:6px;
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .mobile-header{display:flex}
  .topbar{display:none}
  .page{padding:16px;padding-top:72px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .wizard-step .step-label{display:none}
  .modal{max-width:100%}
  .toast-container{left:16px;right:16px;bottom:16px}
  .toast{min-width:unset}
}

/* GRID UTILITIES */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:600px){.grid-2,.grid-3{grid-template-columns:1fr}}

.flex{display:flex}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.items-center{align-items:center}.justify-between{justify-content:space-between}
.flex-1{flex:1}.flex-wrap{flex-wrap:wrap}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.text-sm{font-size:13px}.text-xs{font-size:11px}.text-lg{font-size:18px}
.text-muted{color:var(--text2)}.text-dim{color:var(--text3)}
.font-bold{font-weight:700}.font-mono{font-family:var(--font-mono)}
.text-blue{color:var(--blue)}.text-green{color:var(--green)}.text-yellow{color:var(--yellow)}.text-red{color:var(--red)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-full{width:100%}
</style>
</head>

<div id="root"></div>
