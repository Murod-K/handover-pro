<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
  --text: var(--tg-theme-text-color, #000000);
  --hint: var(--tg-theme-hint-color, #8e8e93);
  --btn: var(--tg-theme-button-color, #007aff);
  --btn-text: var(--tg-theme-button-text-color, #ffffff);
  --ok: #34c759; --warn: #ff9500; --danger: #ff3b30;
  --r: 14px; --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg2);color:var(--text)}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(68px + var(--safe));-webkit-overflow-scrolling:touch}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid rgba(0,0,0,0.1);display:flex;padding-bottom:var(--safe);z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 7px;border:none;background:none;color:var(--hint);font-size:10px;font-weight:500;cursor:pointer}
.nav-btn.on{color:var(--btn)}
.nav-btn svg{width:22px;height:22px}

/* HERO */
.hero{background:var(--btn);color:#fff;padding:22px 20px 26px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-30px;right:-30px;width:160px;height:160px;background:rgba(255,255,255,0.07);border-radius:50%}
.hero-sub{font-size:13px;opacity:.75;margin-bottom:3px}
.hero-name{font-size:21px;font-weight:700;margin-bottom:18px}
.hero-stats{display:flex;gap:20px}
.hstat .n{font-size:30px;font-weight:800;line-height:1}
.hstat .l{font-size:11px;opacity:.7;margin-top:2px}

/* CARDS */
.card{background:var(--bg);border-radius:var(--r);box-shadow:0 1px 4px rgba(0,0,0,.07)}
.section{font-size:12px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;padding:14px 16px 6px}

/* ACTION GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 14px}
.act{background:var(--bg);border:none;border-radius:var(--r);padding:15px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.07);transition:transform .12s}
.act:active{transform:scale(.96)}
.act-icon{font-size:22px}

/* SHIFT CARD */
.scard{background:var(--bg);border-radius:var(--r);margin:0 16px 10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;display:flex;align-items:center;gap:14px;transition:transform .12s}
.scard:active{transform:scale(.98)}
.sicon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.sicon.open{background:#fff8e1}.sicon.closed{background:#e8f5e9}.sicon.partial{background:#fff3e0}
.sinfo{flex:1;min-width:0}
.sobj{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smeta{font-size:12px;color:var(--hint);margin-top:2px}
.sright{text-align:right;flex-shrink:0}
.sm3{font-size:16px;font-weight:700;color:var(--btn)}
.sdate{font-size:11px;color:var(--hint);margin-top:2px}

/* FORM */
.fhdr{background:var(--btn);color:#fff;padding:18px 20px;font-size:19px;font-weight:700}
.steps{display:flex;gap:5px;padding:14px 16px 8px}
.sdot{height:4px;border-radius:2px;flex:1;background:rgba(0,0,0,.1);transition:background .3s}
.sdot.on{background:var(--btn)}.sdot.done{background:var(--ok)}
.fsec{background:var(--bg);border-radius:var(--r);margin:0 16px 12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.frow{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid rgba(0,0,0,.05);gap:10px}
.frow:last-child{border-bottom:none}
.flbl{font-size:14px;color:var(--hint);width:100px;flex-shrink:0}
.finp{flex:1;border:none;background:none;font-size:15px;color:var(--text);font-family:inherit;outline:none;text-align:right}
.finp::placeholder{color:var(--hint)}

/* SEG */
.seg{display:flex;background:var(--bg2);border-radius:9px;padding:2px;flex:1}
.sbtn{flex:1;border:none;background:none;padding:7px 3px;font-size:12px;font-weight:500;border-radius:7px;cursor:pointer;color:var(--hint);transition:all .2s}
.sbtn.on{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:10px 16px}
.chip{padding:7px 13px;border-radius:20px;border:1.5px solid rgba(0,0,0,.1);font-size:13px;font-weight:500;cursor:pointer;color:var(--hint);background:var(--bg);transition:all .15s}
.chip.on-ok{border-color:var(--ok);background:#f0fff4;color:var(--ok)}
.chip.on-warn{border-color:var(--warn);background:#fffbeb;color:var(--warn)}
.chip.on-bad{border-color:var(--danger);background:#fff5f5;color:var(--danger)}
.chip.active{background:var(--btn);border-color:var(--btn);color:#fff}

/* DEFECTS */
.defect-list{padding:0 16px 12px;display:flex;flex-direction:column;gap:6px}
.defect-chip{padding:9px 14px;border-radius:10px;border:1.5px solid rgba(0,0,0,.1);font-size:13px;cursor:pointer;color:var(--text);background:var(--bg);display:flex;align-items:center;gap:8px;transition:all .15s}
.defect-chip.sel{border-color:var(--danger);background:#fff5f5;color:var(--danger)}
.defect-chip .dicon{font-size:16px}

/* SWIPE BTN */
.swipe-wrap{margin:16px 16px;position:relative;height:54px;background:rgba(0,122,255,.1);border-radius:27px;overflow:hidden}
.swipe-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--btn);font-size:14px;font-weight:600;pointer-events:none}
.swipe-thumb{position:absolute;top:4px;left:4px;bottom:4px;width:46px;background:var(--btn);border-radius:23px;cursor:grab;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;user-select:none;touch-action:none;transition:left .15s}
.swipe-thumb.done{width:calc(100% - 8px);background:var(--ok);transition:width .3s}

/* BTN */
.btn{display:block;width:calc(100% - 32px);margin:0 16px 10px;padding:15px;background:var(--btn);color:var(--btn-text);border:none;border-radius:var(--r);font-size:16px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit;transition:opacity .15s,transform .12s}
.btn:active{opacity:.85;transform:scale(.98)}
.btn.sec{background:var(--bg2);color:var(--text)}
.btn.red{background:var(--danger)}
.btn:disabled{opacity:.4;pointer-events:none}

/* BACK */
.back{padding:14px 20px 0;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--btn);font-size:15px;font-weight:500;background:none;border:none}

/* DETAIL */
.dhero{background:var(--btn);color:#fff;padding:18px 20px}
.dhero h2{font-size:19px;font-weight:700}
.dmeta{font-size:13px;opacity:.8;margin-top:5px;line-height:1.6}
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px}
.sc{background:var(--bg);border-radius:12px;padding:13px 10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.sc .n{font-size:24px;font-weight:800;color:var(--btn)}
.sc .l{font-size:11px;color:var(--hint);margin-top:2px}

/* CONSTRUCT ITEM */
.ci{background:var(--bg);border-radius:var(--r);margin:0 16px 10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.ci-hdr{padding:13px 16px;display:flex;align-items:center;gap:12px}
.ci-icon{width:36px;height:36px;background:#e8f0fe;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px}
.ci-title{font-size:15px;font-weight:600}
.ci-marks{font-size:12px;color:var(--hint)}
.ci-body{padding:0 16px 13px}
.ci-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--hint)}
.ci-row span:last-child{color:var(--text);font-weight:500}

/* WARN */
.wbadge{background:#fff8e1;border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:9px 14px;margin:0 16px 10px;font-size:13px;color:#7c5e00}

/* FILTER */
.fbar{display:flex;gap:7px;padding:11px 16px;overflow-x:auto;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;padding:6px 13px;border-radius:18px;background:var(--bg);border:1.5px solid rgba(0,0,0,.1);font-size:13px;font-weight:600;cursor:pointer;color:var(--hint);transition:all .15s}
.fchip.on{background:var(--btn);border-color:var(--btn);color:#fff}

/* PROFILE */
.avatar{width:76px;height:76px;border-radius:50%;background:var(--btn);display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;margin:22px auto 10px}
.pname{text-align:center;font-size:19px;font-weight:700;margin-bottom:3px}
.prole{text-align:center;font-size:13px;color:var(--hint);margin-bottom:18px}
.litem{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid rgba(0,0,0,.05)}
.litem:last-child{border-bottom:none}
.licon{font-size:19px;width:26px}
.llbl{flex:1;font-size:15px}
.lval{font-size:13px;color:var(--hint)}

/* LOADING / EMPTY */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:10px;color:var(--hint)}
.spin{width:30px;height:30px;border:3px solid rgba(0,0,0,.1);border-top-color:var(--btn);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:44px 20px;color:var(--hint)}
.empty-i{font-size:44px;margin-bottom:10px}
.empty-t{font-size:16px;font-weight:600;color:var(--text);margin-bottom:5px}

/* PENDING BADGE */
.pending-badge{background:#fff3e0;border:1px solid var(--warn);border-radius:10px;margin:0 16px 10px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.pending-badge .pb-text{flex:1;font-size:14px;color:#7c5e00}
.pending-badge .pb-btn{background:var(--btn);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}

/* AUTOCOMPLETE */
.ac-list{background:var(--bg);border-radius:var(--r);margin:0 16px 12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.ac-item{padding:13px 16px;border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer;font-size:15px;display:flex;align-items:center;gap:10px}
.ac-item:last-child{border-bottom:none}
.ac-item:active{background:var(--bg2)}
.ac-new{color:var(--btn);font-weight:600}

/* LANG BADGE */
.lang-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}

/* NOTE */
.note-box{background:var(--bg);border-radius:var(--r);margin:0 16px 12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.note-ta{width:100%;border:none;background:none;font-size:15px;color:var(--text);font-family:inherit;outline:none;padding:14px 16px;resize:none;min-height:100px}
.note-preview{padding:14px 16px;font-size:14px;line-height:1.6;color:var(--text);white-space:pre-wrap}

/* STATUS */
.status-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-ok{background:var(--ok)}.dot-warn{background:var(--warn)}.dot-bad{background:var(--danger)}

/* ADMIN */
.user-card{background:var(--bg);border-radius:var(--r);margin:0 16px 10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;align-items:center;gap:12px}
.user-av{width:38px;height:38px;border-radius:50%;background:var(--btn);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:15px;font-weight:600}
.user-meta{font-size:12px;color:var(--hint)}
.user-actions{display:flex;gap:6px}
.ua-btn{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
.ua-approve{background:#e8f5e9;color:var(--ok)}
.ua-reject{background:#fff5f5;color:var(--danger)}
.ua-role{background:var(--bg2);color:var(--hint)}

/* PHOTO GRID */
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin:0 16px 14px}
.pthumb{aspect-ratio:1;border-radius:7px;object-fit:cover;width:100%;background:var(--bg2)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end}
.modal{background:var(--bg);border-radius:var(--r) var(--r) 0 0;width:100%;padding:20px 16px;padding-bottom:calc(20px + var(--safe));max-height:80vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:700;margin-bottom:14px}
.modal-input{width:100%;border:1.5px solid rgba(0,0,0,.12);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;margin-bottom:10px}
.modal-input:focus{border-color:var(--btn)}

/* NIGHT CHECKLIST */
.cl-item{background:var(--bg);border-radius:var(--r);margin:0 16px 8px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;align-items:flex-start;gap:12px}
.cl-cb{width:22px;height:22px;border-radius:6px;border:2px solid rgba(0,0,0,.15);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .2s}
.cl-cb.checked{background:var(--ok);border-color:var(--ok);color:#fff}
.cl-info{flex:1}
.cl-title{font-size:14px;font-weight:600}
.cl-sub{font-size:12px;color:var(--hint);margin-top:2px}
.cl-add-btn{background:none;border:1.5px dashed rgba(0,0,0,.15);border-radius:var(--r);margin:0 16px 10px;padding:13px 16px;cursor:pointer;text-align:center;color:var(--btn);font-size:14px;font-weight:600;width:calc(100% - 32px)}
</style>
</head>

function go(tab) { hap(); TAB=tab; renderNav(); render(); }

// ── DATA ─────────────────────────────────────────────────────────────
async function loadUser() {
  const tgU = tg.initDataUnsafe?.user;
  if (!tgU) { USER={id:'dev',name:'Dev User',role:'admin',shift_type:'day',lang:'ru',approved:true,telegram_id:0}; LANG='ru'; return; }
  const snap = await db.ref('users').once('value');
  const all = snap.val()||{};
  for(const [uid,u] of Object.entries(all)) {
    if(u.telegram_id===tgU.id) { USER={...u,id:uid}; LANG=u.lang||'ru'; return; }
  }
  // New user — create pending
  const ref = db.ref('users').push({
    telegram_id:tgU.id,
    name:tgU.first_name+(tgU.last_name?' '+tgU.last_name:''),
    username:tgU.username||'',
    role:'engineer',shift_type:'day',lang:'ru',approved:false
  });
  USER={telegram_id:tgU.id,name:tgU.first_name,role:'engineer',shift_type:'day',lang:'ru',approved:false,id:ref.key};
}

async function loadShifts() {
  const snap = await db.ref('shifts').once('value');
  const all = snap.val()||{};
  const arr = Object.entries(all).map(([id,v])=>({...v,id}));
  arr.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  SHIFTS = USER?.role==='engineer' ? arr.filter(s=>s.engineer_id===USER.id) : arr;
}

async function loadObjects() {
  const snap = await db.ref('objects').once('value');
  OBJECTS = Object.entries(snap.val()||{}).map(([id,v])=>({...v,id}));
}

// ── RENDER ───────────────────────────────────────────────────────────
async function render() {
  const s = document.getElementById('screen');
  s.innerHTML = '<div class="loading"><div class="spin"></div></div>';
  await loadShifts(); await loadObjects();
  if (!USER?.approved && USER?.role!=='admin') { renderPending(); return; }
  switch(TAB) {
    case 'home': renderHome(); break;
    case 'shift': initNewShift(); break;
    case 'history': renderHistory(); break;
    case 'profile': renderProfile(); break;
    case 'admin': renderAdmin(); break;
  }
}

function shiftCard(s) {

  const date=(s.created_at||'').slice(0,10);
  return `<div class="scard" onclick="showDetail('${s.id}')">

    <div class="sinfo">
      <div class="sobj">${s.object_name||'—'}</div>
      <div class="smeta">${icons[s.status]||'⚪'} ${(s.constructions||[]).length} конструкц. • ${s.engineer_name||'—'}</div>
    </div>
    <div class="sright"><div class="sm3">${Math.round(m3)} м³</div><div class="sdate">${date}</div></div>
  </div>`;
}

function emptyState(icon,title) {
  return `<div class="empty"><div class="empty-i">${icon}</div><div class="empty-t">${title}</div></div>`;
}

// ── NEW SHIFT ─────────────────────────────────────────────────────────
function initNewShift() {
  DRAFT={object_name:'',object_id:'',block:'',floor:'',shift_type:USER?.shift_type||'day',note:''};
  TEMP_C=[]; STEP=1;
  renderStep();
}

function renderStep() {
  const s=document.getElementById('screen');
  const dots=[1,2,3,4].map(i=>`<div class="sdot ${i<STEP?'done':i===STEP?'on':''}"></div>`).join('');
  const titles={1:t('object'),2:t('constructions'),3:t('notes'),4:t('summary')};
  s.innerHTML=`<div class="fhdr">${titles[STEP]||''}</div><div class="steps">${dots}</div>${stepContent()}`;
  if(STEP===4) initSwipe('swipe-create',submitShift);
  if(STEP===2) initSupplyAutocomplete();
}

function stepContent() {
  if(STEP===1) return step1();
  if(STEP===2) return step2();
  if(STEP===3) return step3();
  if(STEP===4) return step4();
  return '';
}

// STEP 1 — Object
function step1() {
  const objOpts = OBJECTS.map(o=>`<option value="${o.id}">${o.name}</option>`).join('');
  const blkOpts = DRAFT.object_id ? (OBJECTS.find(o=>o.id===DRAFT.object_id)?.blocks||[]).map(b=>`<option value="${b}">${b}</option>`).join('') : '';
  return `
    <div class="section">${t('object')}</div>
    <div class="fsec">
      <div class="frow">
        <span class="flbl">${t('object')}</span>
        <input class="finp" id="inp-obj" list="obj-list" placeholder="East Tower..." value="${DRAFT.object_name}" oninput="onObjInput(this.value)">
        <datalist id="obj-list">${objOpts}</datalist>
      </div>
      <div class="frow">
        <span class="flbl">${t('block')}</span>
        <input class="finp" id="inp-block" list="blk-list" placeholder="Ramp2, Tower A..." value="${DRAFT.block}" oninput="DRAFT.block=this.value">
        <datalist id="blk-list">${blkOpts}</datalist>
      </div>
      <div class="frow">
        <span class="flbl">${t('floor')}</span>
        <input class="finp" id="inp-floor" placeholder="5" type="text" value="${DRAFT.floor}" oninput="DRAFT.floor=this.value">
      </div>
      <div class="frow">
        <span class="flbl">${t('shift_type')}</span>
        <div class="seg">
          <button class="sbtn ${DRAFT.shift_type==='day'?'on':''}" onclick="setShiftType('day')">${t('day')}</button>
          <button class="sbtn ${DRAFT.shift_type==='night'?'on':''}" onclick="setShiftType('night')">${t('night')}</button>
        </div>
      </div>
    </div>
    <button class="btn" onclick="nextStep1()">${t('next')}</button>
  `;
}

function onObjInput(val) {
  DRAFT.object_name = val;
  const found = OBJECTS.find(o=>o.name.toLowerCase()===val.toLowerCase());
  if(found) { DRAFT.object_id=found.id; updateBlockList(found); }
}

function updateBlockList(obj) {
  const dl = document.getElementById('blk-list');
  if(dl && obj.blocks) dl.innerHTML = obj.blocks.map(b=>`<option value="${b}">${b}</option>`).join('');
}

function setShiftType(t) {
  DRAFT.shift_type=t;
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('on'));
  event.target.classList.add('on');
}

function nextStep1() {
  DRAFT.object_name = document.getElementById('inp-obj')?.value?.trim();
  DRAFT.block = document.getElementById('inp-block')?.value?.trim();
  DRAFT.floor = document.getElementById('inp-floor')?.value?.trim();
  if(!DRAFT.object_name) { tg.showAlert(t('object')+' — обязательное поле'); return; }
  // Save object to DB if new
  saveObjectIfNew();
  hap('medium'); STEP=2; renderStep();
}

async function saveObjectIfNew() {
  if(!DRAFT.object_name) return;
  const exists = OBJECTS.find(o=>o.name.toLowerCase()===DRAFT.object_name.toLowerCase());
  if(!exists) {
    const ref = await db.ref('objects').push({name:DRAFT.object_name,blocks:[],created_at:new Date().toISOString()});
    DRAFT.object_id = ref.key;
    OBJECTS.push({name:DRAFT.object_name,blocks:[],id:ref.key});
  }
  // Save block
  if(DRAFT.block && DRAFT.object_id) {
    const obj = OBJECTS.find(o=>o.id===DRAFT.object_id);
    if(obj && !obj.blocks?.includes(DRAFT.block)) {
      obj.blocks = [...(obj.blocks||[]), DRAFT.block];
      await db.ref(`objects/${DRAFT.object_id}/blocks`).set(obj.blocks);
    }
  }
}

// STEP 2 — Constructions
function step2() {
  const cItems = TEMP_C.map((c,i)=>constructionMiniCard(c,i)).join('');
  return `
    <div class="section">${t('constructions')} (${TEMP_C.length})</div>
    ${cItems}
    <div id="c-form">
      <div class="fsec">
        <div class="frow">
          <span class="flbl">${t('type')}</span>
          <select class="finp" id="c-type" style="color:var(--text)">${C_TYPES.map(x=>`<option>${x}</option>`).join('')}</select>
        </div>
        <div class="frow">
          <span class="flbl">${t('marks')}</span>
          <input class="finp" id="c-marks" placeholder="К-1, К-2, К-3">
        </div>
        <div class="frow">
          <span class="flbl">${t('concrete_m3')}</span>
          <input class="finp" id="c-m3" placeholder="45" type="number">
        </div>
        <div class="frow">
          <span class="flbl">${t('supply')}</span>
          <input class="finp" id="c-supply" list="supply-list" placeholder="насос...">
          <datalist id="supply-list"></datalist>
        </div>
      </div>
      <div class="section">${t('rebar')}</div>
      <div class="chips" id="rebar-chips">
        ${statusChips('rebar','accepted')}
      </div>
      <div id="rebar-defects" style="display:none">
        <div class="section">${t('defects')}</div>
        ${DEFAULT_REBAR_DEFECTS.map(d=>`<div class="defect-chip" id="rd-${d.id}" onclick="toggleDefect('rebar','${d.id}',this)"><span class="dicon">${d.icon}</span>${d.text[LANG]||d.text.ru}</div>`).join('')}
        <div class="defect-list" id="custom-rebar-defects"></div>
        <button onclick="addCustomDefect('rebar')" class="cl-add-btn">${t('add_defect')}</button>
      </div>
      <div class="section">${t('formwork')}</div>
      <div class="chips" id="formwork-chips">
        ${statusChips('formwork','accepted')}
      </div>
      <div id="formwork-defects" style="display:none">
        <div class="section">${t('defects')}</div>
        ${DEFAULT_FORMWORK_DEFECTS.map(d=>`<div class="defect-chip" id="fd-${d.id}" onclick="toggleDefect('formwork','${d.id}',this)"><span class="dicon">${d.icon}</span>${d.text[LANG]||d.text.ru}</div>`).join('')}
        <div class="defect-list" id="custom-formwork-defects"></div>
        <button onclick="addCustomDefect('formwork')" class="cl-add-btn">${t('add_defect')}</button>
      </div>
      <div class="section">${t('geodesy')}</div>
      <div class="chips" id="geodesy-chips">
        ${statusChips('geodesy','accepted')}
      </div>
    </div>
    <button class="btn sec" onclick="addConstruction()">${t('add_construction')}</button>
    <button class="btn" onclick="nextStep2()" ${TEMP_C.length===0?'disabled':''}>${t('next')}</button>
    <button class="btn sec" onclick="prevStep()">${t('back')}</button>
  `;
}

function statusChips(field, selected) {
  const opts = [{v:'accepted',cls:'on-ok',lbl:t('ok')},{v:'partial',cls:'on-warn',lbl:t('partial')},{v:'not_accepted',cls:'on-bad',lbl:t('not_ok')}];
  return opts.map(o=>`<div class="chip ${o.v===selected?o.cls:''}" onclick="selectStatus('${field}','${o.v}',this,'${o.cls}')">${o.lbl}</div>`).join('');
}

window._sel = {rebar:'accepted',formwork:'accepted',geodesy:'accepted'};
window._defects = {rebar:[],formwork:[]};

function selectStatus(field, val, el, cls) {
  hap();
  window._sel[field] = val;
  const container = document.getElementById(`${field}-chips`);
  container.querySelectorAll('.chip').forEach(c=>{c.className='chip'});
  el.classList.add(cls);
  const defDiv = document.getElementById(`${field}-defects`);
  if(defDiv) defDiv.style.display = (val==='partial'||val==='not_accepted')?'block':'none';
}

function toggleDefect(field, id, el) {
  hap();
  const arr = window._defects[field];
  const idx = arr.indexOf(id);
  if(idx>=0) { arr.splice(idx,1); el.classList.remove('sel'); }
  else { arr.push(id); el.classList.add('sel'); }
}

function addCustomDefect(field) {
  showModal(`<div class="modal-title">${t('add_defect')}</div>
    <input class="modal-input" id="custom-d-inp" placeholder="Описание дефекта...">
    <button class="btn" onclick="saveCustomDefect('${field}')">${t('next')}</button>`);
}

function saveCustomDefect(field) {
  const val = document.getElementById('custom-d-inp')?.value?.trim();
  if(!val) return;
  const container = document.getElementById(`custom-${field}-defects`);
  const id = 'custom_'+Date.now();
  window._defects[field].push(id);
  window[`_custom_${field}_${id}`] = val;
  container.innerHTML += `<div class="defect-chip sel"><span class="dicon">📝</span>${val}</div>`;
  closeModal();
}

function addConstruction() {
  const type = document.getElementById('c-type')?.value;
  const marksRaw = document.getElementById('c-marks')?.value||'';
  const m3 = parseFloat(document.getElementById('c-m3')?.value)||0;
  const supply = document.getElementById('c-supply')?.value||'';
  const marks = marksRaw.split(/[,\s]+/).map(m=>m.trim()).filter(Boolean);
  if(!marks.length) marks.push(type[0]+'-1');

  // Save supply option
  saveSupplyOption(supply);

  TEMP_C.push({
    type, marks, concrete_plan_m3:m3, concrete_method:supply,
    rebar_status:window._sel.rebar, rebar_defects:[...window._defects.rebar],
    formwork_status:window._sel.formwork, formwork_defects:[...window._defects.formwork],
    geodesy_status:window._sel.geodesy,
  });
  window._sel={rebar:'accepted',formwork:'accepted',geodesy:'accepted'};
  window._defects={rebar:[],formwork:[]};
  hap('medium'); STEP=2; renderStep();
}

async function saveSupplyOption(val) {
  if(!val) return;
  const snap = await db.ref('supply_options').once('value');
  const existing = snap.val()||[];
  if(!existing.includes(val)) await db.ref('supply_options').set([...existing,val]);
}

async function initSupplyAutocomplete() {
  const snap = await db.ref('supply_options').once('value');
  const opts = [...new Set([...SUPPLY_OPTIONS,...(snap.val()||[])])];
  const dl = document.getElementById('supply-list');
  if(dl) dl.innerHTML = opts.map(o=>`<option value="${o}">`).join('');
}

function constructionMiniCard(c,i) {
  const marks=(c.marks||[]).join(', ');
  const statusIcon={accepted:'✅',partial:'⚠️',not_accepted:'❌'};
  return `<div class="scard" style="margin-bottom:8px">
    <div style="flex:1"><div class="sobj">${c.type} (${marks})</div>
    <div class="smeta">${statusIcon[c.rebar_status]}арм • ${statusIcon[c.formwork_status]}оп • ${statusIcon[c.geodesy_status]}гео • ${c.concrete_plan_m3||0}м³</div></div>
    <button onclick="removeC(${i})" style="background:none;border:none;color:var(--danger);font-size:20px;cursor:pointer;padding:4px">✕</button>
  </div>`;
}

function removeC(i) { hap(); TEMP_C.splice(i,1); renderStep(); }

function nextStep2() {
  if(!TEMP_C.length) { tg.showAlert(t('add_construction')); return; }
  hap('medium'); STEP=3; renderStep();
}

// STEP 3 — Notes
function step3() {
  return `
    <div class="section">${t('notes')}</div>

function checkWarnings(cs) {
  const w=[];
  cs.forEach(c=>{
    const m=(c.marks||[]).join(', ');
    if(c.concrete_plan_m3&&c.rebar_status==='not_accepted') w.push(`${c.type} (${m}): арматура не принята`);
    if(c.concrete_plan_m3&&c.formwork_status==='not_accepted') w.push(`${c.type} (${m}): опалубка не принята`);
    if(c.concrete_plan_m3&&c.geodesy_status!=='accepted') w.push(`${c.type} (${m}): геодезия не принята`);
  });
  return w;
}

// SWIPE BTN
function initSwipe(containerId, onDone) {
  const cont = document.getElementById(containerId);
  if(!cont) return;
  const thumb = cont.querySelector('.swipe-thumb');
  let startX=0, isDrag=false;
  const maxX = ()=>cont.offsetWidth-thumb.offsetWidth-8;
  const getX = e => e.touches?e.touches[0].clientX:e.clientX;
  const onStart = e=>{isDrag=true;startX=getX(e)-parseInt(thumb.style.left||0);hap()};
  const onMove = e=>{if(!isDrag)return;e.preventDefault();const x=Math.max(0,Math.min(maxX(),getX(e)-startX));thumb.style.left=x+'px'};
  const onEnd = ()=>{
    if(!isDrag)return;isDrag=false;
    if(parseInt(thumb.style.left||0)>=maxX()*.85){
      thumb.classList.add('done');thumb.innerHTML='✓';hapN();
      setTimeout(onDone,600);
    } else {thumb.style.left='0px';}
  };
  thumb.addEventListener('mousedown',onStart);
  thumb.addEventListener('touchstart',onStart,{passive:false});
  document.addEventListener('mousemove',onMove);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('mouseup',onEnd);
  document.addEventListener('touchend',onEnd);
}

      <div class="user-actions">
        ${isPending?`
          <button class="ua-btn ua-approve" onclick="approveUser('${u.id}')">${t('approve')}</button>
          <button class="ua-btn ua-reject" onclick="rejectUser('${u.id}')">${t('reject')}</button>
        `:`
          <select class="ua-btn ua-role" onchange="changeRole('${u.id}',this.value)" style="cursor:pointer">
            ${['engineer','supervisor','admin'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}
          </select>
        `}
      </div>
    </div>`;

  s.innerHTML = `
    <div class="fhdr">👑 Администратор</div>
    ${pending.length?`<div class="section">⏳ Ожидают доступа (${pending.length})</div>${pending.map(u=>userCard(u,true)).join('')}`:''}
    <div class="section">✅ Пользователи (${approved.length})</div>
    ${approved.map(u=>userCard(u,false)).join('')}
    <div class="section">Объекты</div>
    <div class="fsec">
      ${OBJECTS.map(o=>`<div class="litem"><span class="licon">🏗</span><span class="llbl">${o.name}</span><span class="lval">${(o.blocks||[]).length} блоков</span></div>`).join('')}
    </div>
    <button class="btn" onclick="manageObjects()" style="margin-top:4px">Управление объектами</button>
    <div style="height:20px"></div>
  `;
}

async function approveUser(uid) {
  hap('medium');
  await db.ref(`users/${uid}`).update({approved:true});
  tg.showAlert('Пользователь одобрен');
  renderAdmin();
}

async function rejectUser(uid) {
  tg.showConfirm('Удалить пользователя?', async ok=>{
    if(!ok) return;
    await db.ref(`users/${uid}`).remove();
    renderAdmin();
  });
}

async function changeRole(uid, role) {
  await db.ref(`users/${uid}`).update({role});
  hap();
}

// ── REPORT ───────────────────────────────────────────────────────────
function downloadReport(shiftId) {
  tg.showAlert('📄 Отчёт будет отправлен в чат. Используйте /report ' + shiftId);
}

// ── MODAL ─────────────────────────────────────────────────────────────
function showModal(content) {
  const existing = document.getElementById('modal-overlay');
  if(existing) existing.remove();
  const div = document.createElement('div');
  div.className='modal-overlay'; div.id='modal-overlay';
  div.innerHTML=`<div class="modal">${content}<button class="btn sec" style="margin-top:8px" onclick="closeModal()">✕ Закрыть</button></div>`;
  div.addEventListener('click',e=>{if(e.target===div)closeModal();});
  document.body.appendChild(div);
}

function closeModal() {
  const el=document.getElementById('modal-overlay');
  if(el) el.remove();
}

// ── INIT ──────────────────────────────────────────────────────────────
async function init() {
  renderNav();
  document.getElementById('screen').innerHTML='<div class="loading"><div class="spin"></div></div>';
  await loadUser();
  await render();
}

init();
</script>
</body>
</html>
